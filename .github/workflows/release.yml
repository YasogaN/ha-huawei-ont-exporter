name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax check
        run: |
          for f in scripts/*.sh; do
            echo "==> $f"
            sh -n "$f"
          done
      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Run unit tests
        run: ./scripts/test.sh

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        env:
          IMAGE: ${{ github.repository }}
        run: |
          IMAGE_LC="$(printf '%s' "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          BASE="${REGISTRY}/${IMAGE_LC}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "tags=${BASE}:${VERSION},${BASE}:latest" >> "${GITHUB_OUTPUT}"
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
            echo "image=${BASE}" >> "${GITHUB_OUTPUT}"
            echo "is_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tags=${BASE}:latest" >> "${GITHUB_OUTPUT}"
            echo "version=dev" >> "${GITHUB_OUTPUT}"
            echo "image=${BASE}" >> "${GITHUB_OUTPUT}"
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Create GitHub Release
        if: steps.meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          name: Huawei ONT Exporter v${{ steps.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            Published to GHCR as `${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}`

            ```sh
            podman pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ```
