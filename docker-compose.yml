services:
  huawei-ont-exporter:
    # Pulls the published image from GHCR. To build locally instead, uncomment
    # the line below (and drop the `image` if you want a local-only build):
    # build: .
    image: ghcr.io/yasogan/ha-huawei-ont-exporter:latest
    container_name: huawei-ont-exporter
    restart: unless-stopped
    env_file: .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
